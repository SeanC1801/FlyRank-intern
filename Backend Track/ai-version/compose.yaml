services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      - taskdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://taskuser:taskpass@db:5432/taskdb
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskdata:
